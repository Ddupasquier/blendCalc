name: Hosted Authentication Verification

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - "**"
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: hosted-auth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auth-changes:
    name: Detect Authentication Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Detect authentication-owned changes
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            node scripts/operations/quality/verify_release_promotion.mjs --against origin/staging
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "staging" ]]; then
            if git fetch origin mock-staging:refs/remotes/origin/mock-staging && \
              node scripts/operations/quality/verify_release_promotion.mjs --against origin/mock-staging; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          comparison_base="$PR_BASE_SHA"
          if [[ -z "$comparison_base" && "$EVENT_NAME" == "push" && "$REF_NAME" == "staging" ]]; then
            comparison_base="$BEFORE_SHA"
          elif [[ -z "$comparison_base" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            comparison_base=$(git merge-base origin/staging HEAD)
          fi
          if [[ -z "$comparison_base" || "$comparison_base" =~ ^0+$ ]] || ! git cat-file -e "$comparison_base^{commit}" 2>/dev/null; then
            git fetch origin staging:refs/remotes/origin/staging
            comparison_base=$(git merge-base origin/staging HEAD)
          fi

          if git diff --quiet "$comparison_base" HEAD -- \
            .github/workflows/hosted-auth-verification.yml \
            scripts/operations/auth/check_auth_config.mjs \
            src/hooks.server.ts \
            src/lib/server/auth \
            src/lib/supabase \
            src/routes/auth \
            src/routes/+layout.server.ts \
            package.json \
            package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  hosted-auth:
    name: Check Hosted Auth Health
    needs: auth-changes
    if: needs.auth-changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUBLIC_SUPABASE_URL: ${{ vars.BLENDCALC_HOSTED_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BLENDCALC_HOSTED_SUPABASE_PUBLISHABLE_KEY }}
      PUBLIC_SITE_URL: ${{ vars.BLENDCALC_HOSTED_SITE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify public hosted authentication endpoints
        run: npm run check:auth

  hosted-auth-gate:
    name: Hosted Auth Health
    if: always()
    needs:
      - auth-changes
      - hosted-auth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required authentication verification passed
        env:
          AUTH_CHANGED: ${{ needs.auth-changes.outputs.changed }}
          AUTH_RESULT: ${{ needs.hosted-auth.result }}
          DETECTION_RESULT: ${{ needs.auth-changes.result }}
        run: |
          if [[ "$DETECTION_RESULT" != "success" ]]; then
            echo "Authentication change detection failed: $DETECTION_RESULT"
            exit 1
          fi
          if [[ "$AUTH_CHANGED" == "true" && "$AUTH_RESULT" != "success" ]]; then
            echo "Hosted authentication verification did not pass: $AUTH_RESULT"
            exit 1
          fi
          if [[ "$AUTH_CHANGED" == "false" && "$AUTH_RESULT" != "skipped" ]]; then
            echo "Unexpected hosted authentication verification result: $AUTH_RESULT"
            exit 1
          fi
