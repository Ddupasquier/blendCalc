name: Verify

run-name: Verify (${{ github.event_name == 'workflow_dispatch' && inputs.scope || github.ref_name }})

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - staging
      - main
      - mock-staging
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope for an explicitly selected candidate
        required: true
        default: full
        type: choice
        options:
          - full
          - feature
      desktop_webkit_workers:
        description: Desktop WebKit workers (one requires explicit release approval)
        required: true
        default: "2"
        type: choice
        options:
          - "2"
          - "1"

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-plan:
    name: Choose Verification Scope
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      comparison-base: ${{ steps.plan.outputs.comparison-base }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Choose the smallest safe verification scope
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          mode=feature
          comparison_base="$PR_BASE_SHA"
          documentation_base="$PR_BASE_SHA"
          if [[ "$EVENT_NAME" == "push" ]]; then
            documentation_base="$BEFORE_SHA"
          fi
          documentation_scope=$(COMPARISON_BASE="$documentation_base" node --input-type=module -e '
            import { readVerificationScope } from "./scripts/lib/quality/verification_scope.mjs";
            console.log(readVerificationScope({ comparisonBase: process.env.COMPARISON_BASE }));
          ')

          same_tree() {
            node --input-type=module -e '
              import { verifyMatchingGitTrees } from "./scripts/lib/quality/release_verification_receipt.mjs";
              verifyMatchingGitTrees(process.cwd(), process.argv[1]);
            ' "$1"
          }

          reuse_verified_candidate() {
            local candidate
            if ! candidate=$(node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { verifyMatchingGitTrees } from "./scripts/lib/quality/release_verification_receipt.mjs";

          const repository = process.env.GITHUB_REPOSITORY;
          const shaPattern = /^[0-9a-f]{40}$/;
          const inspected = new Map();
          class DiscoveryError extends Error {}
          const diagnostic = (reason, sha = "discovery") =>
            console.error(`Verification candidate ${sha}: ${reason}.`);
          const run = (command, args) =>
            execFileSync(command, args, {
              encoding: "utf8",
              maxBuffer: 1024 * 1024, stdio: ["ignore", "pipe", "pipe"],
            }).trim();
          const api = (path) => {
            try { return JSON.parse(run("gh", ["api", `repos/${repository}/${path}`])); }
            catch { throw new DiscoveryError("API-unavailable-or-invalid-response"); }
          };
          const inspect = (reference) => {
            let sha;
            try { sha = run("git", ["rev-parse", "--verify", `${reference}^{commit}`]); }
            catch {
              diagnostic("object-missing", reference);
              return null;
            }
            if (!shaPattern.test(sha)) throw new DiscoveryError("invalid-commit-identity");
            if (inspected.has(sha)) return inspected.get(sha);
            const result = { sha, sameTree: false, verified: false };
            inspected.set(sha, result);
            try { verifyMatchingGitTrees(process.cwd(), sha); }
            catch (error) {
              if (error.message.startsWith("Promotion tree ")) {
                diagnostic("tree-mismatch", sha);
                return result;
              }
              throw new DiscoveryError("unclean-or-unreadable-candidate");
            }
            result.sameTree = true;
            const response = api(`actions/workflows/verify.yml/runs?head_sha=${sha}&event=workflow_dispatch&status=success&per_page=20`);
            if (!Array.isArray(response.workflow_runs) || response.workflow_runs.length > 20 ||
                response.workflow_runs.some((run) => !Number.isSafeInteger(run.id) || run.id <= 0 ||
                  run.head_sha !== sha || run.repository?.full_name !== repository)) {
              throw new DiscoveryError("invalid-workflow-evidence-identity");
            }
            result.verified = response.workflow_runs.some((run) =>
              run.event === "workflow_dispatch" && run.display_title === "Verify (full)" &&
              run.status === "completed" && run.conclusion === "success");
            diagnostic(result.verified ? "verified-full-proof" : "no-full-proof", sha);
            return result;
          };

          try {
            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repository ?? "")) {
              throw new DiscoveryError("invalid-repository-identity");
            }
            const lineage = run("git", ["show", "-s", "--format=%H %P", "HEAD"]).split(/\s+/);
            if (lineage.length > 9 || lineage.some((sha) => !shaPattern.test(sha))) {
              throw new DiscoveryError("invalid-or-excessive-immediate-lineage");
            }
            diagnostic(`selected-lineage-count=${lineage.length}`);
            let verified;
            for (const reference of new Set(lineage)) {
              const root = inspect(reference);
              if (!root?.sameTree) continue;
              if (root.verified) { verified = root.sha; break; }
              const pulls = api(`commits/${root.sha}/pulls?per_page=10`);
              if (!Array.isArray(pulls) || pulls.length > 10 || pulls.some((pull) =>
                pull.base?.repo?.full_name !== repository || !shaPattern.test(pull.head?.sha ?? "") ||
                (pull.merged_at !== null && (typeof pull.merged_at !== "string" || !Number.isFinite(Date.parse(pull.merged_at)) ||
                  !shaPattern.test(pull.merge_commit_sha ?? "") || typeof pull.head.repo?.full_name !== "string")))) {
                throw new DiscoveryError("invalid-pull-request-evidence-identity");
              }
              const heads = [...new Set(pulls.filter((pull) =>
                pull.merged_at && pull.merge_commit_sha === root.sha &&
                pull.head.repo?.full_name === repository).map((pull) => pull.head.sha))];
              diagnostic(`merged-source-count=${heads.length}`, root.sha);
              for (const head of heads) {
                if (inspect(head)?.verified) { verified = head; break; }
              }
              if (verified) break;
            }
            diagnostic(`checked-candidate-count=${inspected.size}`);
            if (verified) console.log(verified);
          } catch (error) {
            diagnostic(`reuse-refused:${error instanceof DiscoveryError ? error.message : "unexpected-error"}`);
            process.exitCode = 1;
          }
          NODE
            ); then
              echo "Candidate discovery could not prove reuse; preserving the full verification fallback."
              return
            fi
            if [[ -n "$candidate" ]]; then
              echo "Reusing the successful full verification for identical candidate ${candidate}."
              mode=reuse
              comparison_base="$candidate"
            fi
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${REQUESTED_SCOPE:-full}"
          elif [[ "$documentation_scope" == "documentation" && ( "$EVENT_NAME" != "push" || "$REF_NAME" != "main" ) ]]; then
            mode=documentation
            comparison_base="$documentation_base"
          elif [[ "$EVENT_NAME" == "pull_request" && "${HEAD_REF:-}" == release/* ]]; then
            reuse_verified_candidate
            if [[ "$mode" != "reuse" ]]; then
              echo "Release review requires a successful full dispatch for this exact clean tree."
              exit 1
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            same_tree origin/staging
            mode=reuse
            comparison_base=origin/staging
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "staging" ]]; then
            if git fetch origin mock-staging:refs/remotes/origin/mock-staging && \
              same_tree origin/mock-staging; then
              mode=reuse
              comparison_base=origin/mock-staging
            else
              mode=full
              comparison_base="$BEFORE_SHA"
              reuse_verified_candidate
              if [[ "$mode" != "reuse" ]]; then
                echo "No identical fully verified candidate; running the full staging checks."
              fi
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "mock-staging" ]]; then
            mode=full
          fi

          if [[ "$mode" != "reuse" && ( -z "$comparison_base" || "$comparison_base" =~ ^0+$ ) ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            comparison_base=$(git merge-base origin/staging HEAD)
          elif [[ "$mode" == "feature" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            comparison_base=$(git merge-base origin/staging HEAD)
          fi

          dependencies=false
          if [[ "$mode" == "full" || "$mode" == "reuse" ]]; then
            dependencies=true
          elif [[ "$mode" == "feature" ]] && ! git diff --quiet "$comparison_base" HEAD -- \
            package.json package-lock.json npm-shrinkwrap.json config/dependencyAuditException.json \
            scripts/lib/security/dependency_audit_policy.mjs scripts/lib/security/run_dependency_audit.mjs \
            scripts/operations/quality/audit_dependencies.mjs .github/workflows/verify.yml; then
            dependencies=true
          fi

          echo "comparison-base=$comparison_base" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  preflight:
    name: Security And Repository Policy Preflight
    if: needs.verification-plan.outputs.mode != 'documentation'
    needs: verification-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install policy-test dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies before expensive browser work
        if: needs.verification-plan.outputs.dependencies == 'true'
        run: node scripts/operations/quality/audit_dependencies.mjs
      - name: Run release policy contracts
        run: >-
          npm run test:focused --
          tests/scripts/scriptHeaders.test.mjs
          tests/scripts/projectTicketLifecycle.test.mjs
          tests/config/developmentRulesStructure.test.ts
          tests/config/playwrightTestingArchitecture.test.ts
          tests/scripts/dependencyAuditPolicy.test.mjs

  source:
    name: Source, Tests, And Build
    needs: verification-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only
    steps:
      - name: Reuse the identical candidate result
        if: needs.verification-plan.outputs.mode == 'reuse'
        run: echo "The promoted tree exactly matches the verified candidate."
      - name: Check out repository history
        if: needs.verification-plan.outputs.mode != 'reuse'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        if: needs.verification-plan.outputs.mode != 'reuse'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: needs.verification-plan.outputs.mode != 'reuse' && needs.verification-plan.outputs.mode != 'documentation'
        run: npm ci
      - name: Install documentation dependencies without lifecycle scripts
        if: needs.verification-plan.outputs.mode == 'documentation'
        run: npm ci --ignore-scripts
      - name: Verify documentation contracts
        if: needs.verification-plan.outputs.mode == 'documentation'
        run: |
          node scripts/operations/environment/run_test_command.mjs -- node node_modules/@sveltejs/kit/svelte-kit.js sync
          npm run test:focused -- tests/config/documentationQuality.test.ts tests/config/documentationSite.test.ts tests/config/developmentRulesStructure.test.ts
      - name: Verify versions
        if: needs.verification-plan.outputs.mode != 'reuse' && needs.verification-plan.outputs.mode != 'documentation'
        run: npm run version:check
      - name: Lint TypeScript, Svelte, and SCSS
        if: needs.verification-plan.outputs.mode != 'reuse' && needs.verification-plan.outputs.mode != 'documentation'
        run: npm run lint
      - name: Check source formatting
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm run format:check
        env:
          FORMAT_BASE_REF: ${{ needs.verification-plan.outputs.comparison-base }}
      - name: Check Svelte and TypeScript
        if: needs.verification-plan.outputs.mode != 'reuse' && needs.verification-plan.outputs.mode != 'documentation'
        run: npm run check
      - name: Run affected Vitest coverage
        if: needs.verification-plan.outputs.mode != 'reuse' && needs.verification-plan.outputs.mode != 'documentation'
        run: npm run test:affected
        env:
          TEST_BASE_REF: ${{ needs.verification-plan.outputs.comparison-base }}
      - name: Build production application
        if: needs.verification-plan.outputs.mode != 'reuse' && needs.verification-plan.outputs.mode != 'documentation'
        run: npm run build

  browser:
    name: Browser / ${{ matrix.label }}
    if: needs.verification-plan.outputs.mode == 'full'
    needs:
      - verification-plan
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop-chromium
            project: desktop-chromium
            browser: chromium
          - label: desktop-webkit
            project: desktop-webkit
            browser: webkit
    env:
      PLAYWRIGHT_ENFORCE_DURATION_BUDGETS: true
      PLAYWRIGHT_WORKERS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run browser project
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_DESKTOP_WEBKIT_WORKERS: ${{ inputs.desktop_webkit_workers }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$PLAYWRIGHT_PROJECT" == "desktop-webkit" && "$REQUESTED_DESKTOP_WEBKIT_WORKERS" == "1" ]]; then
            export PLAYWRIGHT_WORKERS=1
          fi
          args=(--project="$PLAYWRIGHT_PROJECT" --grep=@smoke)
          npm run test:e2e -- "${args[@]}"
      - name: Upload nutrition-switch review images
        if: success() && matrix.project == 'desktop-chromium'
        uses: actions/upload-artifact@v4
        with:
          name: nutrition-switch-${{ matrix.label }}-${{ github.run_attempt }}
          path: test-results/playwright/**/nutrition-viewing-switch-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-affected:
    name: Affected Browser Flows
    if: needs.verification-plan.outputs.mode == 'feature'
    needs:
      - verification-plan
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BASE_REF: ${{ needs.verification-plan.outputs.comparison-base }}
      # Selected flows share this job's database and privileged fixtures.
      PLAYWRIGHT_WORKERS: 1
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install affected browsers
        run: node scripts/operations/quality/run_affected_tests.mjs browser --install-browsers
      - name: Run affected browser flows
        run: npm run test:e2e:affected

  browser-gate:
    name: Browser Matrix
    if: always()
    needs:
      - verification-plan
      - preflight
      - source
      - browser
      - browser-affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required verification passed
        env:
          AFFECTED_RESULT: ${{ needs.browser-affected.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          MODE: ${{ needs.verification-plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.verification-plan.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SOURCE_RESULT" != "success" ]]; then
            echo "Verification planning or source checks failed."
            exit 1
          fi
          if [[ "$MODE" == "documentation" ]]; then
            [[ "$PREFLIGHT_RESULT" == "skipped" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "skipped" ]]
          elif [[ "$MODE" == "reuse" ]]; then
            [[ "$PREFLIGHT_RESULT" == "success" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "skipped" ]]
          elif [[ "$MODE" == "full" ]]; then
            [[ "$PREFLIGHT_RESULT" == "success" && "$BROWSER_RESULT" == "success" && "$AFFECTED_RESULT" == "skipped" ]]
          elif [[ "$MODE" == "feature" ]]; then
            [[ "$PREFLIGHT_RESULT" == "success" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "success" ]]
          else
            echo "Unknown verification mode: $MODE"
            exit 1
          fi
