name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - staging
      - mobile-ui-rebuild
      - "ui-rebuild/**"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, Tests, And Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify versions
        run: npm run version:check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Run Vitest
        run: npm test
      - name: Build production application
        run: npm run build

  browser:
    name: Browser / ${{ matrix.project }}
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    env:
      PLAYWRIGHT_WORKERS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare isolated test database
        run: npm run test:e2e:prepare
      - name: Run browser project
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-gate:
    name: Browser Matrix
    if: always()
    needs:
      - source
      - browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every browser project passed
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [[ "$SOURCE_RESULT" != "success" || "$BROWSER_RESULT" != "success" ]]; then
            echo "Source result: $SOURCE_RESULT"
            echo "Browser matrix result: $BROWSER_RESULT"
            exit 1
          fi
