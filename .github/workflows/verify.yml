name: Verify

run-name: Verify (${{ github.event_name == 'workflow_dispatch' && inputs.scope || github.ref_name }})

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      scope:
        description: Verification scope for an explicitly selected candidate
        required: true
        default: full
        type: choice
        options:
          - full
          - feature

permissions:
  actions: read
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification-plan:
    name: Choose Verification Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      comparison-base: ${{ steps.plan.outputs.comparison-base }}
      dependencies: ${{ steps.plan.outputs.dependencies }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Choose the smallest safe verification scope
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_SCOPE: ${{ inputs.scope }}
        run: |
          mode=feature
          comparison_base="$PR_BASE_SHA"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="${REQUESTED_SCOPE:-full}"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            node scripts/operations/quality/verify_release_promotion.mjs --against origin/staging
            mode=reuse
            comparison_base=origin/staging
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "staging" ]]; then
            if git fetch origin mock-staging:refs/remotes/origin/mock-staging && \
              node scripts/operations/quality/verify_release_promotion.mjs --against origin/mock-staging; then
              mode=reuse
              comparison_base=origin/mock-staging
            else
              mode=full
              comparison_base="$BEFORE_SHA"
              for candidate in HEAD $(git show -s --format=%P HEAD); do
                if ! node scripts/operations/quality/verify_release_promotion.mjs --against "$candidate" >/dev/null 2>&1; then
                  continue
                fi
                verified_runs=$(gh api \
                  "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?head_sha=${candidate}&status=success&per_page=20" \
                  --jq '[.workflow_runs[] | select(.event == "workflow_dispatch" and .display_title == "Verify (full)")] | length')
                if [[ "$verified_runs" -gt 0 ]]; then
                  echo "Reusing the successful full verification for identical candidate ${candidate}."
                  mode=reuse
                  comparison_base="$candidate"
                  break
                fi
              done
              if [[ "$mode" != "reuse" ]]; then
                echo "No identical fully verified candidate; running the full staging checks."
              fi
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "mock-staging" ]]; then
            mode=full
          fi

          if [[ "$mode" != "reuse" && ( -z "$comparison_base" || "$comparison_base" =~ ^0+$ ) ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            comparison_base=$(git merge-base origin/staging HEAD)
          elif [[ "$mode" == "feature" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            comparison_base=$(git merge-base origin/staging HEAD)
          fi

          dependencies=false
          if [[ "$mode" == "full" ]]; then
            dependencies=true
          elif [[ "$mode" == "feature" ]] && ! git diff --quiet "$comparison_base" HEAD -- \
            package.json package-lock.json npm-shrinkwrap.json; then
            dependencies=true
          fi

          echo "comparison-base=$comparison_base" >> "$GITHUB_OUTPUT"
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  preflight:
    name: Security And Repository Policy Preflight
    if: needs.verification-plan.outputs.mode != 'reuse'
    needs: verification-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install policy-test dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies before expensive browser work
        if: needs.verification-plan.outputs.dependencies == 'true'
        run: npm audit --audit-level=moderate
      - name: Run release policy contracts
        run: >-
          npm run test:focused --
          tests/scripts/scriptHeaders.test.mjs
          tests/scripts/projectTicketLifecycle.test.mjs
          tests/config/developmentRulesStructure.test.ts
          tests/config/playwrightTestingArchitecture.test.ts

  source:
    name: Source, Tests, And Build
    needs: verification-plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only
    steps:
      - name: Reuse the identical candidate result
        if: needs.verification-plan.outputs.mode == 'reuse'
        run: echo "The promoted tree exactly matches the verified candidate."
      - name: Check out repository history
        if: needs.verification-plan.outputs.mode != 'reuse'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        if: needs.verification-plan.outputs.mode != 'reuse'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm ci
      - name: Verify versions
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm run version:check
      - name: Lint TypeScript, Svelte, and SCSS
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm run lint
      - name: Check source formatting
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm run format:check
        env:
          FORMAT_BASE_REF: ${{ needs.verification-plan.outputs.comparison-base }}
      - name: Check Svelte and TypeScript
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm run check
      - name: Run affected Vitest coverage
        if: needs.verification-plan.outputs.mode == 'feature'
        run: npm run test:affected
      - name: Run complete Vitest coverage
        if: needs.verification-plan.outputs.mode == 'full'
        run: npm test
      - name: Build production application
        if: needs.verification-plan.outputs.mode != 'reuse'
        run: npm run build

  browser:
    name: Browser / ${{ matrix.label }}
    if: needs.verification-plan.outputs.mode == 'full'
    needs:
      - verification-plan
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: desktop-chromium-1-of-2
            project: desktop-chromium
            browser: chromium
            shard: "1/2"
          - label: desktop-chromium-2-of-2
            project: desktop-chromium
            browser: chromium
            shard: "2/2"
          - label: desktop-firefox
            project: desktop-firefox
            browser: firefox
            shard: ""
          - label: desktop-webkit
            project: desktop-webkit
            browser: webkit
            shard: ""
          - label: mobile-chromium
            project: mobile-chromium
            browser: chromium
            shard: ""
          - label: mobile-webkit
            project: mobile-webkit
            browser: webkit
            shard: ""
    env:
      PLAYWRIGHT_ENFORCE_DURATION_BUDGETS: true
      PLAYWRIGHT_WORKERS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare isolated test database
        run: npm run test:e2e:prepare
      - name: Run browser project
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: |
          args=(--project="$PLAYWRIGHT_PROJECT")
          if [[ -n "$PLAYWRIGHT_SHARD" ]]; then
            args+=(--shard="$PLAYWRIGHT_SHARD")
          fi
          npx playwright test "${args[@]}"
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.label }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-affected:
    name: Affected Browser Flows
    if: needs.verification-plan.outputs.mode == 'feature'
    needs:
      - verification-plan
      - preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install affected browsers
        run: node scripts/operations/quality/run_affected_tests.mjs browser --install-browsers
      - name: Run affected browser flows
        run: npm run test:e2e:affected

  browser-gate:
    name: Browser Matrix
    if: always()
    needs:
      - verification-plan
      - preflight
      - source
      - browser
      - browser-affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required verification passed
        env:
          AFFECTED_RESULT: ${{ needs.browser-affected.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          MODE: ${{ needs.verification-plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.verification-plan.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          if [[ "$PLAN_RESULT" != "success" || "$SOURCE_RESULT" != "success" ]]; then
            echo "Verification planning or source checks failed."
            exit 1
          fi
          if [[ "$MODE" == "reuse" ]]; then
            [[ "$PREFLIGHT_RESULT" == "skipped" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "skipped" ]]
          elif [[ "$MODE" == "full" ]]; then
            [[ "$PREFLIGHT_RESULT" == "success" && "$BROWSER_RESULT" == "success" && "$AFFECTED_RESULT" == "skipped" ]]
          elif [[ "$MODE" == "feature" ]]; then
            [[ "$PREFLIGHT_RESULT" == "success" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "success" ]]
          else
            echo "Unknown verification mode: $MODE"
            exit 1
          fi
