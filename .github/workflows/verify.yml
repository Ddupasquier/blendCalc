name: Verify

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source, Tests, And Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      reuse: ${{ steps.promotion.outputs.reuse }}
    env:
      PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_compile_only
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Choose release verification path
        id: promotion
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          reuse=false
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" ]]; then
            git fetch origin staging:refs/remotes/origin/staging
            node scripts/operations/quality/verify_release_promotion.mjs --against origin/staging
            reuse=true
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "staging" ]]; then
            if git fetch origin mock-staging:refs/remotes/origin/mock-staging && \
              node scripts/operations/quality/verify_release_promotion.mjs --against origin/mock-staging; then
              reuse=true
            else
              echo "No identical verified mock-staging candidate; running the full staging checks."
            fi
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.promotion.outputs.reuse != 'true'
        run: npm ci
      - name: Verify versions
        if: steps.promotion.outputs.reuse != 'true'
        run: npm run version:check
      - name: Audit dependencies
        if: steps.promotion.outputs.reuse != 'true'
        run: npm audit --audit-level=high
      - name: Lint TypeScript, Svelte, and SCSS
        if: steps.promotion.outputs.reuse != 'true'
        run: npm run lint
      - name: Check source formatting
        if: steps.promotion.outputs.reuse != 'true'
        run: npm run format:check
        env:
          FORMAT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Check Svelte and TypeScript
        if: steps.promotion.outputs.reuse != 'true'
        run: npm run check
      - name: Run Vitest
        if: steps.promotion.outputs.reuse != 'true'
        run: npm test
      - name: Build production application
        if: steps.promotion.outputs.reuse != 'true'
        run: npm run build

  browser:
    name: Browser / ${{ matrix.project }}
    if: github.event_name == 'push' && (github.ref_name == 'mock-staging' || ((github.ref_name == 'staging' || github.ref_name == 'main') && needs.source.outputs.reuse != 'true'))
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            browser: chromium
          - project: desktop-firefox
            browser: firefox
          - project: desktop-webkit
            browser: webkit
          - project: mobile-chromium
            browser: chromium
          - project: mobile-webkit
            browser: webkit
    env:
      PLAYWRIGHT_ENFORCE_DURATION_BUDGETS: true
      PLAYWRIGHT_WORKERS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Prepare isolated test database
        run: npm run test:e2e:prepare
      - name: Run browser project
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/playwright/
          if-no-files-found: ignore
          retention-days: 7

  browser-affected:
    name: Affected Browser Flows
    if: github.event_name == 'pull_request' || (github.ref_name != 'mock-staging' && github.ref_name != 'staging' && github.ref_name != 'main')
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install affected browsers
        run: node scripts/operations/quality/run_affected_tests.mjs browser --install-browsers
      - name: Run affected browser flows
        run: npm run test:e2e:affected

  browser-gate:
    name: Browser Matrix
    if: always()
    needs:
      - source
      - browser
      - browser-affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm every browser project passed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REUSE_PROMOTION: ${{ needs.source.outputs.reuse }}
          SOURCE_RESULT: ${{ needs.source.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AFFECTED_RESULT: ${{ needs.browser-affected.result }}
        run: |
          if [[ "$EVENT_NAME" == "push" && ("$REF_NAME" == "staging" || "$REF_NAME" == "main") ]]; then
            if [[ "$REUSE_PROMOTION" == "true" ]]; then
              [[ "$SOURCE_RESULT" == "success" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "skipped" ]]
            else
              [[ "$SOURCE_RESULT" == "success" && "$BROWSER_RESULT" == "success" && "$AFFECTED_RESULT" == "skipped" ]]
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "mock-staging" ]]; then
            [[ "$SOURCE_RESULT" == "success" && "$BROWSER_RESULT" == "success" && "$AFFECTED_RESULT" == "skipped" ]]
          else
            [[ "$SOURCE_RESULT" == "success" && "$BROWSER_RESULT" == "skipped" && "$AFFECTED_RESULT" == "success" ]]
          fi
