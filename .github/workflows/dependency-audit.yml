name: Dependency Audit

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:

concurrency:
  group: dependency-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Audit Locked Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Audit moderate and higher advisories
        run: npm audit --package-lock-only --ignore-scripts --audit-level=moderate
