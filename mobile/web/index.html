<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="color-scheme" content="light dark" />
		<title>blendCalc</title>
		<style>
			:root {
				font-family:
					system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #1b1b2e;
				background: #f7f7fb;
			}

			body {
				display: grid;
				min-height: 100vh;
				min-height: 100dvh;
				margin: 0;
				place-items: center;
			}

			main {
				box-sizing: border-box;
				width: min(28rem, calc(100% - 2rem));
				padding: 2rem;
				text-align: center;
				background: #ffffff;
				border: 1px solid #d9d9e4;
				border-radius: 1.25rem;
			}

			h1 {
				margin: 0 0 0.75rem;
			}

			p {
				margin: 0;
				line-height: 1.5;
			}

			@media (prefers-color-scheme: dark) {
				:root {
					color: #f7f7fb;
					background: #10141d;
				}

				main {
					background: #1c2230;
					border-color: #353d4e;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>blendCalc mobile</h1>
			<p>
				The native shell is ready. The authenticated mobile client will be
				connected here without weakening the web app's server boundaries.
			</p>
		</main>
	</body>
</html>
