<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Your password was changed</title>
	</head>
	<body
		style="
			margin: 0;
			background: #f8f8fb;
			color: #1a1a2e;
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.55;
		"
	>
		<table
			role="presentation"
			width="100%"
			cellspacing="0"
			cellpadding="0"
			border="0"
		>
			<tr>
				<td align="center" style="padding: 32px 16px">
					<table
						role="presentation"
						width="100%"
						cellspacing="0"
						cellpadding="0"
						border="0"
						style="
							max-width: 600px;
							background: #fff;
							border: 1px solid #dedee6;
							border-radius: 20px;
						"
					>
						<tr>
							<td style="padding: 32px">
								<p style="margin: 0 0 24px; font-size: 20px; font-weight: 800">
									blendCalc
								</p>
								<p
									style="
										margin: 0 0 8px;
										font-size: 12px;
										font-weight: 700;
										letter-spacing: 0.08em;
										text-transform: uppercase;
										color: #9c5f46;
									"
								>
									Security notice
								</p>
								<h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.2">
									Your password was changed
								</h1>
								<p style="margin: 0; color: #343449">
									The password for <strong>{{ .Email }}</strong> was changed. If
									you made this change, no action is needed.
								</p>
							</td>
						</tr>
						<tr>
							<td
								style="
									padding: 20px 32px;
									border-top: 1px solid #e9e9ed;
									font-size: 12px;
									color: #70758d;
								"
							>
								If this was not you, reset your password immediately and contact
								support@blendcalc.food.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
