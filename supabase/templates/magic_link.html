<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Sign in to blendCalc</title>
	</head>
	<body
		style="
			margin: 0;
			background: #f8f8fb;
			color: #1a1a2e;
			font-family: Arial, Helvetica, sans-serif;
			line-height: 1.55;
		"
	>
		<table
			role="presentation"
			width="100%"
			cellspacing="0"
			cellpadding="0"
			border="0"
		>
			<tr>
				<td align="center" style="padding: 32px 16px">
					<table
						role="presentation"
						width="100%"
						cellspacing="0"
						cellpadding="0"
						border="0"
						style="
							max-width: 600px;
							background: #fff;
							border: 1px solid #dedee6;
							border-radius: 20px;
						"
					>
						<tr>
							<td style="padding: 32px">
								<p style="margin: 0 0 24px; font-size: 20px; font-weight: 800">
									blendCalc
								</p>
								<p
									style="
										margin: 0 0 8px;
										font-size: 12px;
										font-weight: 700;
										letter-spacing: 0.08em;
										text-transform: uppercase;
										color: #347b99;
									"
								>
									Secure sign-in
								</p>
								<h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.2">
									Sign in to blendCalc
								</h1>
								<p style="margin: 0 0 24px; color: #343449">
									Use the secure link or one-time code below to sign in as
									<strong>{{ .Email }}</strong>.
								</p>
								<p style="margin: 0 0 20px">
									<a
										href="{{ .ConfirmationURL }}"
										style="
											display: inline-block;
											padding: 13px 20px;
											border-radius: 12px;
											background: #57a773;
											color: #11141c;
											font-weight: 700;
											text-decoration: none;
										"
										>Sign in</a
									>
								</p>
								<p
									style="
										margin: 0 0 24px;
										padding: 14px;
										border-radius: 12px;
										background: #e8f5ee;
										text-align: center;
										font-size: 24px;
										font-weight: 800;
										letter-spacing: 0.12em;
									"
								>
									{{ .Token }}
								</p>
								<p style="margin: 0; color: #70758d; font-size: 13px">
									Or copy and paste this link:<br /><a
										href="{{ .ConfirmationURL }}"
										style="color: #347b99; word-break: break-all"
										>{{ .ConfirmationURL }}</a
									>
								</p>
							</td>
						</tr>
						<tr>
							<td
								style="
									padding: 20px 32px;
									border-top: 1px solid #e9e9ed;
									font-size: 12px;
									color: #70758d;
								"
							>
								If you did not request this sign-in, ignore this email. Never
								share the code.
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
